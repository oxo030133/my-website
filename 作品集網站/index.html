<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>相簿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1f1f1f;--mut:#8c8c8c;--line:#ececec;--ac:#1f1f1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.7 'Noto Sans TC',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:88px 32px 64px}
.brand{font:400 .68rem 'Jost',sans-serif;letter-spacing:.45em;color:var(--mut)}
h1{font-weight:300;font-size:clamp(1.8rem,4.5vw,2.8rem);letter-spacing:.06em;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:48px 32px;margin-top:64px}
.cv{display:block;aspect-ratio:4/3;background:#f3f3f3 center/cover;transition:opacity .4s}
.card:hover .cv{opacity:.85}
.card h2{font-weight:400;font-size:1.15rem;margin:14px 0 2px}
.sub{color:var(--mut);font-size:.85rem}
.meta{color:var(--mut);font-size:.72rem;letter-spacing:.1em;margin-top:2px}
footer{margin-top:96px;padding-top:24px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem;letter-spacing:.08em}
.back{color:var(--mut);font-size:.8rem;letter-spacing:.15em;display:inline-block;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 24px}
.chip{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 14px;border-radius:99px;font:inherit;font-size:.78rem;cursor:pointer}
.chip:hover{border-color:var(--fg);color:var(--fg)}.chip.on{background:var(--fg);border-color:var(--fg);color:#fff}
.masonry{columns:4 240px;column-gap:10px}
.masonry figure{margin:0 0 10px;position:relative;break-inside:avoid;background:#f3f3f3}
.masonry img{width:100%;display:block;cursor:zoom-in}
figure small{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:1px 8px;border-radius:99px;font-size:.68rem;opacity:0;transition:.2s}
figure:hover small{opacity:1}
.heart{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;opacity:0;transition:.2s}
figure:hover .heart,.heart.on{opacity:1}.heart.on{color:#ff5d73}
.ctl{display:flex;gap:6px;margin-top:8px;align-items:center}
figure .ctl{position:absolute;top:6px;left:6px;margin:0}
.ctl button,.eb{background:#fff;color:var(--fg);border:1px solid #d8d8d8;padding:5px 10px;font:inherit;font-size:.72rem;cursor:pointer}
.ctl button:hover,.eb:hover{background:var(--fg);color:#fff}
.big{margin-top:36px;padding:12px 22px}
[contenteditable]{outline:1px dashed rgba(0,0,0,.3);outline-offset:3px;min-width:2em;display:inline-block}
.tb{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:6px}
.tb button{background:#fff;color:var(--fg);border:1px solid #cfcfcf;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:10px 16px;font:inherit;font-size:.78rem;cursor:pointer}
.tb button:hover{background:var(--fg);color:#fff}
#lb{position:fixed;inset:0;background:rgba(255,255,255,.98);display:none;align-items:center;justify-content:center;z-index:100}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:82vh}
#lb button{background:none;border:0;color:#222;font-size:1.8rem;cursor:pointer}
#lb .x{position:absolute;top:14px;right:20px}
#lb .n{position:absolute;top:50%;transform:translateY(-50%);padding:20px}
#lb .p{left:6px}#lb .q{right:6px}
.cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--mut);font-size:.82rem}
.cap a{color:var(--fg);text-decoration:underline;margin-left:14px}
.cap .heart2{font-size:1.2rem!important;color:#999!important}.cap .heart2.on{color:#ff5d73!important}
.bulk{display:flex;gap:8px;margin:0 0 20px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#fff;padding:12px 0;z-index:20;border-bottom:1px solid var(--line)}
.ck{position:absolute;top:8px;right:8px;z-index:5;background:#fff;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.ck input{width:16px;height:16px;margin:0;cursor:pointer;accent-color:#1f1f1f}
.card{position:relative}
figure.sel{outline:3px solid var(--fg);outline-offset:-3px}
.card.sel .cv{outline:3px solid var(--fg);outline-offset:-3px}
.eb.del{border-color:#c0392b;color:#c0392b}.eb.del:hover{background:#c0392b;color:#fff}
.eb[disabled]{opacity:.35;pointer-events:none}
.rt{margin:14px 0 4px;max-width:720px;color:var(--mut);line-height:1.9}
.rt a{color:var(--fg);text-decoration:underline}
.rt[contenteditable]{display:block;min-height:2.4em}
.rt:empty::before{content:attr(data-ph);color:#c4c4c4}
.rt:not([contenteditable]):empty{display:none}
.rtb{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid #ddd;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:8px 10px;max-width:96vw}
.rtb.on{display:flex}
.rtb button,.rtb select{background:#fff;border:1px solid #d8d8d8;padding:5px 9px;font:inherit;font-size:.75rem;cursor:pointer}
.rtb button:hover{background:var(--fg);color:#fff}
.rtb input[type=color]{width:30px;height:28px;padding:0;border:1px solid #d8d8d8;background:none;cursor:pointer}
.sp{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);z-index:150;padding:24px;overflow:auto;transform:translateX(100%);transition:transform .3s;font-size:.8rem}
.sp.on{transform:none}
.sp h4{margin:22px 0 8px;font-weight:500;letter-spacing:.12em;font-size:.72rem;color:var(--mut)}
.sp label{display:block;margin-bottom:8px;color:var(--mut);font-size:.72rem}
.sp select,.sp input[type=text]{width:100%;padding:8px;border:1px solid #d8d8d8;font:inherit;margin:4px 0 8px}
.sp p{color:var(--mut);line-height:1.8;font-size:.72rem}
.lock{text-align:center;max-width:420px}
.lock form{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lock input{padding:10px 14px;border:1px solid #d8d8d8;font:inherit}
.err{width:100%;color:#c0392b;font-size:.8rem;min-height:1.2em;margin:0}
</style>
</head>

async function act(b){

/* 富文字白名單清理 */
function clean(h){
  const d=new DOMParser().parseFromString('<body>'+(h||''),'text/html').body;
  const OK={A:1,B:1,STRONG:1,I:1,EM:1,U:1,BR:1,SPAN:1,P:1,DIV:1,UL:1,OL:1,LI:1};
  (function w(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED)$/.test(c.tagName)){c.remove();return}
    w(c);
    if(!OK[c.tagName]){c.replaceWith(...c.childNodes);return}
    const st=c.getAttribute('style')||'',href=(c.getAttribute('href')||'').trim();
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    const keep=st.split(';').map(x=>x.trim()).filter(x=>/^(font-family|font-size|color|font-weight|font-style|text-decoration|text-align)\s*:/i.test(x)&&!/url|expression|import|javascript|[{}<>]/i.test(x));
    if(keep.length)c.setAttribute('style',keep.join(';'));
    if(c.tagName==='A'){if(/^(https?:|mailto:|#)/i.test(href)){c.setAttribute('href',href);c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer')}else c.replaceWith(...c.childNodes)}
  })})(d);
  return d.innerHTML;
}

/* ZIP 打包下載（不壓縮，純前端）*/
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){
  const parts=[],cd=[],enc=new TextEncoder();let off=0,cs=0;
  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,nm);cs+=46+nm.length;off+=30+nm.length+sz}
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/zip'});
}
async function dlZip(list,name,btn){
  const old=btn.textContent,files=[],ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'};let bad=0;
  for(let i=0;i<list.length;i++){btn.textContent=`打包中 ${i+1}/${list.length}…`;
    try{const bl=await(await fetch(list[i].u)).blob();files.push({name:String(i+1).padStart(3,'0')+'.'+(ext[bl.type]||'jpg'),data:new Uint8Array(await bl.arrayBuffer())})}catch(e){bad++}}
  btn.textContent=old;
  if(!files.length){alert('無法下載：圖片來源不允許打包。');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(zip(files));a.download=(name||'album').replace(/[\\/:*?"<>|]/g,'')+'.zip';a.click();
  if(bad)alert(`有 ${bad} 張因來源限制無法打包。`);
}

  document.addEventListener('mousedown',e=>{if(!e.target.closest('.rt,.rtb'))rb.classList.remove('on')});

  const sb=document.createElement('button');sb.textContent='⚙ 字型設定';tbEl.insertBefore(sb,$('#tS'));
  const sp=document.createElement('div');sp.className='sp';sp.setAttribute('data-ui','');document.body.appendChild(sp);
  const opts=v=>fonts().map(f=>`<option value="${esc(f[1])}"${f[1]===v?' selected':''}>${esc(f[0])}</option>`).join('');
  const draw=()=>{sp.innerHTML=`<button class="eb" data-s="x" style="float:right">✕</button><h4>全站字型</h4><label>標題字型<select id="sh">${opts(th().h)}</select></label><label>內文字型<select id="sbd">${opts(th().b)}</select></label><h4>新增字型</h4><input type="text" id="sg" placeholder="Google Fonts 名稱，例如 Shippori Mincho"><button class="eb" data-s="g">＋ 加入 Google 字型</button><p>也可以上傳字型檔（.woff2 / .ttf / .otf）。中文字型檔很大，會讓網站檔案變重，建議優先使用 Google 字型。</p><input type="file" id="sf" accept=".woff2,.woff,.ttf,.otf"><p>新增後，字型會出現在上方選單，以及文字格式工具列的「字型」選單。</p>`};
  sb.onclick=()=>{draw();sp.classList.toggle('on')};
  sp.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
    if(b.dataset.s==='x')sp.classList.remove('on');
    if(b.dataset.s==='g'){const n=$('#sg').value.trim().replace(/[^\w\- ]/g,'');if(!n)return;D.fonts=D.fonts||[];if(!D.fonts.includes(n))D.fonts.push(n);gfont(n);dirty=true;draw()}});
  sp.addEventListener('change',e=>{const t=e.target;
    if(t.id==='sh'||t.id==='sbd'){D.theme=Object.assign({},th(),{[t.id==='sh'?'h':'b']:t.value});gfont(t.value);applyTheme();dirty=true}
    if(t.id==='sf'&&t.files[0]){const f=t.files[0],n=f.name.replace(/\.[^.]+$/,'').replace(/[^\w\u4e00-\u9fff\- ]/g,'')||'MyFont',r=new FileReader();
      r.onload=()=>{D.ufonts=(D.ufonts||[]).filter(x=>x.name!==n).concat({name:n,data:r.result});ufStyle();dirty=true;draw()};r.readAsDataURL(f)}});
}

render();
</script>
</body>
</html>
